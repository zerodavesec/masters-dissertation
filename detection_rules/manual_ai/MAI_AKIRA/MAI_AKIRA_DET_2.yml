description: Identifies when powershell is being used to remove shadowcopy. Ransomware indicator.
author: manual AI
date: 06/08/2026
tags:
  - attack.impact
  - attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image:
      - "powershell.exe"
      - "pwsh.exe"
    CommandLine|contains|all:
      - "Get-WmiObject"
      - "shadowcopy"
      - "Remove-WmiObject"
  condition: selection
level: medium
