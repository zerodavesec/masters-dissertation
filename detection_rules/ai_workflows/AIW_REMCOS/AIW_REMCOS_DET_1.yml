title: Suspicious DLL Loading by .NET Framework Component
id: 4cb62de1-95b1-464a-8b3d-98dfc4a49711
status: experimental
description: Detects the loading of urlmon.dll by aspnet_compiler.exe, which can be used to facilitate remote content execution or web-based activities in a context where it is not expected.
author: AI Workflows
date: 2026-08-07
tags:
    - attack.defense_evasion
    - attack.t1543.003
logsource:
    category: image_load
    product: windows
detection:
    selection:
        Image|endswith: '\aspnet_compiler.exe'
        ImageLoaded|endswith: '\urlmon.dll'
    condition: selection
level: high
