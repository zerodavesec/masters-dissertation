title: MAN_SNAKE_DET_1
id: 2924dd4f-0869-4daf-b409-e5e3b36a5705
status: experimental
description: Detects when an exclusion for Microsoft Defender is added via powershell for a file in a suspicious location and with an obfuscated name
author: Manual
date: 04/08/2026
tags:
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains|all:
      - " Add-MpPreference "
      - " -ExclusionPath "
  selection_2:
    CommandLine|contains:
      - '\Windows\Start Menu\Programs\StartUp\'
      - '\AppData\Roaming\'
      - '\Users\Public\'
      - '\AppData\Local\Temp\'
  selection_3:
    CommandLine|re: '\\[a-zA-Z]{4,20}\.exe'
  condition: selection_1 and selection_2 and selection_3
level: medium
