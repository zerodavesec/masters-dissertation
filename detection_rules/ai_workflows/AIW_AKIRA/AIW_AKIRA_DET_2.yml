title: Ransomware Note Creation
id: 9487f74b-4ad8-4215-9a63-3cfa814dc757
status: experimental
description: Detects the creation of files containing 'readme' in the filename by executable processes, which is often indicative of ransom notes being dropped during an attack.
author: AI Workflows
date: 2026-08-07
tags:
    - attack.impact
    - attack.t1485
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|contains: "readme"
        Image|endswith: ".exe"
    condition: selection
level: high
