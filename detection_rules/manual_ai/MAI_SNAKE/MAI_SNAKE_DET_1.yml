title: MAI_SNAKE_DET_1
id: ef0783f3-b024-464d-84eb-b488e84eacfe
status: experimental
description: Detects a scheduled task creation from an /XML template, known malware behaviour.
author: Manual AI
date: 06/08/2024
tags:
  - attack.stealth
  - attack.persistence
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
      - "/Create"
      - "/TN"
      - "/XML"
    CommandLine|contains:
      - '\AppData\Local\Temp\'
      - '\Windows\Temp\'
  condition: selection
level: medium
