title: MAN_PHORPIEX_DET_2
id: 667fa695-f533-460c-b914-2ca2c99498a6
status: experimental
description: Matches on an EventID 13 (Registry Value Set) where an executable in a suspicious directory is configured to run based on RegRunKeys for persistence
author: Manual
date: 04/08/2026
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    EventID: 13
    Image|endswith: ".exe"
    TargetObject|contains: '\Microsoft\Windows\CurrentVersion\Run'
    Details|contain:
      - 'C:\Windows\'
      - '\AppData\Roaming\'
      - '\Users\Public\'
      - '\AppData\Local\Temp\'
  selection_2:
    Details|contain: ".exe"
  condition: selection and selection_2
level: medium
