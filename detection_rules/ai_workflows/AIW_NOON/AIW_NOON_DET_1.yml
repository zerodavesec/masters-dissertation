title: Persistence via Registry Run Keys in User Directories
id: 8d46af1b-fa04-42c1-8869-b247136249fc
status: experimental
description: Detects the creation of registry keys in the 'Run' hive pointing to executables located in user-writable directories like AppData, a common technique for maintaining persistence.
author: AI Workflows
date: 2026-08-07
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        TargetObject|contains:
            - \Windows\CurrentVersion\Run\
        Image|contains:
            - \AppData\
    condition: selection
level: high
