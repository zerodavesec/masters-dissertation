title: PowerShell Shadow Copy Removal
id: 365b7fc7-dc56-4c2f-aaff-490739776f91
status: experimental
description: Detects the use of PowerShell to remove Win32_Shadowcopy objects, a common technique used by ransomware to prevent system recovery.
author: AI Workflows
date: 2026-08-07
tags:
    - attack.defense_evasion
    - attack.t1490
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'Win32_Shadowcopy'
            - 'Remove-WmiObject'
    condition: selection
level: high
