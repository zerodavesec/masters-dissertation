title: Masqueraded Execution from Startup Folder
id: a07900be-2a53-4f31-8f66-0913813cceeb
status: experimental
description: Detects the loading of an executable with a generic original filename (e.g., Stub.exe) from the Startup folder, indicating potential masquerading and persistence.
author: AI Workflows
date: 2026-08-07
tags:
    - attack.defense_evasion
    - attack.t1036
logsource:
    category: image_load
    product: windows
detection:
    selection:
        Image|contains: '\Start Menu\Programs\StartUp\'
        OriginalFileName: Stub.exe
    condition: selection
level: high
