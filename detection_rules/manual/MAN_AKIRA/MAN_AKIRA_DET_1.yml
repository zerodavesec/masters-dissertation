title: MAN_AKIRA_DET_1
id: a9a05907-a050-4d9a-a4a3-56d8e39b6f36
status: experimental
description: Identifies when a regex pattern that matches the log file from akira, or an akira readme TXT file is dropped in known places
author: manual
date: 03/08/2026
tags:
  - attack.impact
  - attack.t1486
logsource:
  category: file_create
  product: windows
detection:
  selection_exe:
    Image|endswith: ".exe"
  selection_1:
    TargetFilename|re: '.*\\Log-(0[1-9]|[12][0-9]|3[01])-(0[1-9]|1[0-2])-\d{4}-([01][0-9]|2[0-3])-([0-5][0-9])-([0-5][0-9])\.txt'
    Image|contains:
      - "Desktop"
      - "User"
  selection_2:
    TargetFilename|endswith: '\akira_readme.txt'
    TargetFilename|contains:
      - PerfLogs
      - Desktop
  condition: selection_exe and (selection_1 or selection_2)
falsepositives:
level: medium
